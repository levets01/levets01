name: Update profile cards

on:
  schedule:
    - cron: '23 11 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'asset/**/IMG_2087*'
      - 'assets/**/IMG_2087*'
      - 'requirements.txt'
      - '.github/workflows/update-profile.yml'

permissions:
  contents: write

concurrency:
  group: profile-cards-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Refresh GitHub data
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/fetch_github_data.py
      - name: Generate and validate
        run: |
          python -m unittest discover -s tests -v
          python scripts/generate_cards.py
          python scripts/validate_profile.py
      - name: Commit changes
        run: |
          git add -- README.md data/github_stats.json assets/generated
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh profile cards"
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
